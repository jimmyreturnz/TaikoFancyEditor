
name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build portable Windows application
        run: pyinstaller --noconfirm --clean TaikoFancyArranger.spec

      - name: Add release documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/TaikoFancyArranger/README.md
          Copy-Item LICENSE dist/TaikoFancyArranger/LICENSE

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/TaikoFancyArranger/* -DestinationPath TaikoFancyArranger-Windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaikoFancyArranger-Windows-x64
          path: TaikoFancyArranger-Windows-x64.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Taiko Fancy Arranger ${{ github.ref_name }}
          generate_release_notes: true
          files: TaikoFancyArranger-Windows-x64.zip
